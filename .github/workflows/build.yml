name: Build Whyred Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel branch"
        required: true
        default: "kernel-hmp"
        type: string

      clean_build:
        description: "Clean build"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build Whyred
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/radcolor/android_kernel_xiaomi_whyred.git
      KERNEL_BRANCH: ${{ inputs.branch }}

      ARCH: arm64
      SUBARCH: arm64

      DEFCONFIG: whyred_defconfig

      BUILD_DIR: ${{ github.workspace }}/out
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3

      # Fix for __aarch64_cas4_rel / outline atomics
      KCFLAGS: -mno-outline-atomics

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: radcolor/android_kernel_xiaomi_whyred
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          path: kernel

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            wget \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ============================================================
      # CCACHE
      # ============================================================
      - name: Setup ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: whyred-kernel-ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            whyred-kernel-ccache-${{ runner.os }}-

      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Setup AArch64 GCC
        run: |
          echo "Using system AArch64 GCC"

          aarch64-linux-gnu-gcc --version

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      # ============================================================
      # CLEAN
      # ============================================================
      - name: Clean build
        if: ${{ inputs.clean_build }}
        working-directory: kernel
        run: |
          rm -rf "$BUILD_DIR"

      # ============================================================
      # VERIFY DEFCONFIG
      # ============================================================
      - name: Check defconfig
        working-directory: kernel
        run: |
          test -f arch/arm64/configs/${DEFCONFIG}

          echo "======================================"
          echo "DEFCONFIG FOUND:"
          echo "arch/arm64/configs/${DEFCONFIG}"
          echo "======================================"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p "$BUILD_DIR"

          make O="$BUILD_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            "$DEFCONFIG"

          echo ""
          echo "Kernel configuration:"
          echo "--------------------------------------"

          grep -E \
            'CONFIG_ARCH_SDM660|CONFIG_ARCH_QCOM|CONFIG_PREEMPT|CONFIG_CC_STACKPROTECTOR' \
            "$BUILD_DIR/.config" || true

          echo "--------------------------------------"

      # ============================================================
      # APPLY SAFE COMPILER FLAGS
      # ============================================================
      - name: Apply compiler flags
        working-directory: kernel
        run: |
          echo "KCFLAGS=$KCFLAGS"

          export KCFLAGS="$KCFLAGS"

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="/usr/lib/ccache:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          export KCFLAGS="-mno-outline-atomics"

          echo "======================================"
          echo "BUILDING WHYRED KERNEL"
          echo "======================================"

          make -j"$(nproc)" \
            O="$BUILD_DIR" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            V=1

      # ============================================================
      # CHECK OUTPUT
      # ============================================================
      - name: Check kernel image
        run: |
          echo "======================================"
          echo "CHECKING KERNEL OUTPUT"
          echo "======================================"

          ls -lh "$BUILD_DIR/arch/arm64/boot/" || true

          test -f "$BUILD_DIR/arch/arm64/boot/Image"

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Image.gz-dtb FOUND"
          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "Image.gz FOUND"
          fi

      # ============================================================
      # COPY KERNEL
      # ============================================================
      - name: Prepare kernel image
        run: |
          mkdir -p kernel-output

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" \
              kernel-output/Image.gz-dtb

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz" \
              kernel-output/Image.gz

          else
            cp "$BUILD_DIR/arch/arm64/boot/Image" \
              kernel-output/Image
          fi

          cp "$BUILD_DIR/.config" \
            kernel-output/kernel.config

          ls -lh kernel-output

      # ============================================================
      # CLONE ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/d1aznr/AnyKernel3.git \
            -b whyred \
            "$ANYKERNEL_DIR"

      # ============================================================
      # PACKAGE ANYKERNEL3
      # ============================================================
      - name: Package flashable ZIP
        run: |
          set -e

          cd "$ANYKERNEL_DIR"

          rm -f Image
          rm -f Image.gz
          rm -f Image.gz-dtb

          if [ -f "$GITHUB_WORKSPACE/kernel-output/Image.gz-dtb" ]; then
            cp "$GITHUB_WORKSPACE/kernel-output/Image.gz-dtb" .
          elif [ -f "$GITHUB_WORKSPACE/kernel-output/Image.gz" ]; then
            cp "$GITHUB_WORKSPACE/kernel-output/Image.gz" .
          else
            cp "$GITHUB_WORKSPACE/kernel-output/Image" .
          fi

          zip -r9 \
            "$GITHUB_WORKSPACE/Whyred-Kernel-${GITHUB_RUN_NUMBER}.zip" \
            . \
            -x ".git/*"

      # ============================================================
      # CCACHE STATISTICS
      # ============================================================
      - name: ccache statistics
        run: |
          ccache -s || true

      # ============================================================
      # UPLOAD KERNEL
      # ============================================================
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-Kernel-Image
          path: kernel-output/

      # ============================================================
      # UPLOAD FLASHABLE ZIP
      # ============================================================
      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-Kernel-AnyKernel3
          path: Whyred-Kernel-*.zip
