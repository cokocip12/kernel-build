name: Build Whyred Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel branch
        required: true
        default: kernel-hmp
        type: string

      clean_build:
        description: Clean build
        required: true
        default: true
        type: boolean

      CHARGE_LIMIT:
        description: "USB Charging Current Limit"
        required: true
        default: "900mA"
        type: choice
        options:
          - OFF
          - 500mA
          - 700mA
          - 900mA
          - 1200mA

      LTO:
        description: "Enable Radcolor GCC LTO"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

      LZ4HC:
        description: "Compress kernel with LZ4HC"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

      NETWORK:
        description: "Network/TCP tuning"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "westwood"
          - "cubic"
          - "bbr"

      WIFI_TUNING:
        description: "Wi-Fi Tuning"
        required: true
        default: "BALANCED"
        type: choice
        options:
          - OFF
          - BALANCED
          - PERFORMANCE

      VM_TUNING:
        description: "Pilih VM / Memory Tuning"
        required: true
        default: "BALANCED"
        type: choice
        options:
          - OFF
          - BALANCED
          - PERFORMANCE

      OC:
        description: "CPU Overclock"
        required: true
        default: "off"
        type: choice
        options:
          - off
          - 2.45GHz
      ZRAM:
        description: "Enable Automatic ZRAM"
        required: true
        default: true
        type: boolean

      ROOT_MANAGER:
        description: "Pilih Root Manager"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - kernelsu
          - sukisu
          - apatch
          - resukisu
          - mambosu
          - Ksun

jobs:
  build:
    name: Whyred Kernel
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/radcolor/android_kernel_xiaomi_whyred.git
      KERNEL_BRANCH: ${{ inputs.branch }}

      ARCH: arm64
      SUBARCH: arm64

      DEFCONFIG: whyred_defconfig
      
      BUILD_DIR: ${{ github.workspace }}/out
      KERNEL_DIR: ${{ github.workspace }}/kernel
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3

      # Fix GCC outline atomics
      KCFLAGS: -mno-outline-atomics

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: radcolor/android_kernel_xiaomi_whyred
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          path: kernel

      - name: Apply Radcolor GCC LTO
        if: ${{ inputs.LTO == 'on' }}
        working-directory: kernel
        run: |
          set -e

          echo "======================================"
          echo "RADCOLOR GCC LTO: ON"
          echo "======================================"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # lanjutkan perintah LTO kamu yang sekarang

      # ============================================================
      # DEPENDENCIES + BOTH TOOLCHAINS
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            wget \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Setup toolchains
        run: |
          echo "======================================"
          echo "AARCH64 TOOLCHAIN"
          echo "======================================"

          aarch64-linux-gnu-gcc --version

          echo ""
          echo "======================================"
          echo "ARM32 TOOLCHAIN"
          echo "======================================"

          arm-linux-gnueabi-gcc --version

          echo ""
          echo "======================================"
          echo "SETTING CROSS COMPILE"
          echo "======================================"

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      - name: Install KernelSU
        if: ${{ inputs.ROOT_MANAGER == 'kernelsu' }}
        working-directory: kernel
        run: |
         echo "Installing KernelSU..."
         curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -
  
      - name: Install SukiSU-Ultra
        if: ${{ inputs.ROOT_MANAGER == 'sukisu' }}
        working-directory: kernel
        run: |
         echo "Installing SukiSU-Ultra..."
         curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -

      - name: Install ReSukiSU
        if: ${{ inputs.ROOT_MANAGER == 'resukisu' }}
        working-directory: kernel
        run: |
         echo "Installing ReSukiSU..."
         curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -

      - name: Install MamboSU
        if: ${{ inputs.ROOT_MANAGER == 'mambosu' }}
        working-directory: kernel
        run: |
         echo "Installing MamboSU..."
         curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -master

      - name: Install KernelSU Next
        if: ${{ inputs.ROOT_MANAGER == 'ksun' }}
        working-directory: kernel
        run: |
         echo "=== Installing KernelSU Next ==="

         curl -LSs \
         "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
      
      # ============================================================
      # CCACHE
      # ============================================================
      - name: Setup ccache
        run: |
          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: whyred-kernel-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            whyred-kernel-${{ runner.os }}-

      # ============================================================
      # CLEAN BUILD
      # ============================================================
      - name: Clean build
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf "$BUILD_DIR"

      # ============================================================
      # CHECK SOURCE
      # ============================================================
      - name: Check kernel source
        working-directory: kernel
        run: |
          echo "======================================"
          echo "KERNEL SOURCE"
          echo "======================================"

          git log -1 --oneline

          echo ""
          echo "Kernel version:"
          make kernelversion

          echo ""
          echo "Defconfig:"
          test -f "arch/arm64/configs/${DEFCONFIG}"

          echo "FOUND: arch/arm64/configs/${DEFCONFIG}"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p "$BUILD_DIR"

          make O="$BUILD_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$DEFCONFIG"

          echo ""
          echo "======================================"
          echo "CONFIGURATION"
          echo "======================================"

          grep -E \
            'CONFIG_ARCH_QCOM|CONFIG_ARCH_SDM660|CONFIG_PREEMPT|CONFIG_CC_STACKPROTECTOR' \
            "$BUILD_DIR/.config" || true

      - name: Enable ZRAM
        if: ${{ inputs.ZRAM }}
        working-directory: kernel
        run: |
         set -e

         test -f "$BUILD_DIR/.config" || {
         echo "ERROR: $BUILD_DIR/.config tidak ditemukan"
         exit 1
         }

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_ZRAM

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_ZSMALLOC

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== ZRAM CONFIG ==="
         grep -E '^CONFIG_ZRAM=|^CONFIG_ZSMALLOC=' \
         "$BUILD_DIR/.config" || true

      - name: Configure KALLSYMS for APatch
        if: ${{ inputs.ROOT_MANAGER == 'apatch' }}
        working-directory: kernel
        run: |
         echo "Configuring KALLSYMS..."

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS_ALL
 
         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== KALLSYMS CONFIG ==="
         grep -E '^CONFIG_KALLSYMS(=|_)' "$BUILD_DIR/.config" || true

      - name: Configure KernelSU
        if: ${{ inputs.ROOT_MANAGER == 'kernelsu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure SukiSU-Ultra
        if: ${{ inputs.ROOT_MANAGER == 'sukisu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure ReSukiSU
        if: ${{ inputs.ROOT_MANAGER == 'resukisu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure MamboSU
        if: ${{ inputs.ROOT_MANAGER == 'mambosu' }}
        working-directory: kernel
        run: |
         echo "=== Configuring MamboSU ==="

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KSU

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== MamboSU configuration ==="
         grep -E '^CONFIG_KSU(=|_)' "$BUILD_DIR/.config" || true

      - name: Configure KernelSU Next
        if: ${{ inputs.ROOT_MANAGER == 'Ksun' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      # APatch
      - name: Configure APatch
        if: ${{ inputs.ROOT_MANAGER == 'apatch' }}
        working-directory: kernel
        run: |
         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS_ALL

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

      # ============================================================
      # CPU OVERCLOCK - BIG CLUSTER 2.45GHz
      # ============================================================
      - name: Configure CPU OC
        if: ${{ inputs.OC == '2.45GHz' }}
        working-directory: kernel
        run: |
          set -e

          echo "======================================"
          echo "WHYRED BIG CLUSTER OC"
          echo "======================================"

          DTS_DIR="arch/arm/boot/dts/qcom"

          echo "Searching perfcl speed-bin tables..."

          grep -Rni \
            "qcom,perfcl-speedbin" \
            "$DTS_DIR" \
            2>/dev/null || true

          echo ""
          echo "Searching existing 2.4576GHz entries..."

          grep -Rni \
            "2457600000" \
            "$DTS_DIR" \
            2>/dev/null || true

          echo ""
          echo "Searching Big-cluster frequencies..."

          grep -RniE \
            "1958400000|2150400000|2208000000" \
            "$DTS_DIR" \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo "IMPORTANT"
          echo "======================================"
          echo "No blind global replacement will be performed."
          echo "The correct perfcl speed-bin table must be identified"
          echo "before modifying the OPP/LUT."

      # ============================================================
      # NETWORK / TCP TUNING
      # ============================================================
      - name: Configure Network Tuning
        if: ${{ inputs.NETWORK != 'off' }}
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "NETWORK / TCP TUNING"
          echo "======================================"

          NETWORK="${{ inputs.NETWORK }}"

          echo "Selected profile: $NETWORK"

          case "$NETWORK" in

            westwood)
              echo "Using TCP Westwood"

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_ADVANCED

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_WESTWOOD

              scripts/config --file "$BUILD_DIR/.config" \
                --set-str CONFIG_DEFAULT_TCP_CONG "westwood"
              ;;

            cubic)
              echo "Using TCP CUBIC"

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_ADVANCED

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_CUBIC

              scripts/config --file "$BUILD_DIR/.config" \
                --set-str CONFIG_DEFAULT_TCP_CONG "cubic"
              ;;

            bbr)
              echo "Using BBR + FQ"

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_ADVANCED

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_BBR

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_NET_SCH_FQ

              scripts/config --file "$BUILD_DIR/.config" \
                --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
              ;;

            *)
              echo "ERROR: Unknown network profile: $NETWORK"
              exit 1
              ;;
          esac

          echo ""
          echo "=== FINAL TCP CONFIG ==="

          grep -E \
            'CONFIG_TCP_CONG_|CONFIG_NET_SCH_FQ|CONFIG_DEFAULT_TCP_CONG' \
            "$BUILD_DIR/.config" || true

          echo ""
          echo "Network tuning configured successfully."

      # ============================================================
      # BUILD RAW KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "======================================"
          echo "BUILDING WHYRED KERNEL"
          echo "======================================"

          make -j"$(nproc)" \
            O="$BUILD_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image

          test -f "$BUILD_DIR/arch/arm64/boot/Image"

          echo "=== RAW IMAGE ==="
          ls -lh "$BUILD_DIR/arch/arm64/boot/Image"

      # ============================================================
      # LZ4HC OPTIONAL
      # ============================================================
      - name: Compress kernel with LZ4HC
        if: ${{ inputs.LZ4HC == 'on' }}
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LZ4HC: ON"
          echo "======================================"

          IMAGE="$BUILD_DIR/arch/arm64/boot/Image"

          test -f "$IMAGE" || {
            echo "ERROR: Image tidak ditemukan!"
            exit 1
          }

          sudo apt-get update
          sudo apt-get install -y lz4

          lz4 -9 -f \
            "$IMAGE" \
            "$BUILD_DIR/arch/arm64/boot/Image.lz4"

          echo "=== LZ4HC RESULT ==="
          ls -lh \
            "$IMAGE" \
            "$BUILD_DIR/arch/arm64/boot/Image.lz4"


      - name: LZ4HC OFF
        if: ${{ inputs.LZ4HC == 'off' }}
        run: |
          echo "======================================"
          echo "LZ4HC: OFF"
          echo "======================================"
          echo "Using normal Image"
          
      # ============================================================
      # CHECK OUTPUT
      # ============================================================
      - name: Check kernel image
        run: |
          set -e

          echo "======================================"
          echo "KERNEL OUTPUT"
          echo "======================================"

          ls -lh "$BUILD_DIR/arch/arm64/boot/"

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Image.gz-dtb FOUND"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "Image.gz FOUND"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image" ]; then
            echo "Image FOUND"

          else
            echo "ERROR: Kernel image not found"
            exit 1
          fi

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare kernel image
        run: |
          set -e

          mkdir -p kernel-output

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" \
              kernel-output/Image.gz-dtb

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz" \
              kernel-output/Image.gz

          else
            cp "$BUILD_DIR/arch/arm64/boot/Image" \
              kernel-output/Image
          fi

          cp "$BUILD_DIR/.config" \
            kernel-output/kernel.config

          ls -lh kernel-output

      # ============================================================
      # ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          git clone \
            --depth=1 \
            -b whyred \
            https://github.com/d1aznr/AnyKernel3.git \
            "$ANYKERNEL_DIR"

      - name: VM Tuning
        run: |
          mkdir -p "$ANYKERNEL_DIR/tools"

          MODE="${{ inputs.VM_TUNING }}"

          # Jika input kosong, gunakan BALANCED
          if [ -z "$MODE" ]; then
              MODE="BALANCED"
          fi

          # Validasi mode
          if [ "$MODE" != "OFF" ] && \
             [ "$MODE" != "BALANCED" ] && \
             [ "$MODE" != "PERFORMANCE" ]; then
              echo "ERROR: VM_TUNING tidak valid: $MODE"
              exit 1
          fi

          cat > "$ANYKERNEL_DIR/tools/vm-tuning.sh" <<EOF
          #!/system/bin/sh

          MODE="$MODE"

          setval() {
              if [ -e "\$1" ]; then
                  echo "\$2" > "\$1" 2>/dev/null
              fi
          }

          case "\$MODE" in

            OFF)
              exit 0
              ;;

            BALANCED)
              setval /proc/sys/vm/swappiness 20
              setval /proc/sys/vm/dirty_ratio 15
              setval /proc/sys/vm/dirty_background_ratio 5
              setval /proc/sys/vm/dirty_expire_centisecs 3000
              setval /proc/sys/vm/dirty_writeback_centisecs 1500
              setval /proc/sys/vm/vfs_cache_pressure 75
              setval /proc/sys/vm/page-cluster 0
              ;;

            PERFORMANCE)
              setval /proc/sys/vm/swappiness 10
              setval /proc/sys/vm/dirty_ratio 20
              setval /proc/sys/vm/dirty_background_ratio 5
              setval /proc/sys/vm/dirty_expire_centisecs 2000
              setval /proc/sys/vm/dirty_writeback_centisecs 1000
              setval /proc/sys/vm/vfs_cache_pressure 50
              setval /proc/sys/vm/page-cluster 0
              ;;

          esac

          exit 0
          EOF

          chmod 755 "$ANYKERNEL_DIR/tools/vm-tuning.sh"

          echo "=========================================="
          echo "              VM TUNING"
          echo "=========================================="
          echo "Selected mode : $MODE"
          echo "=========================================="

      - name: WiFi Tuning
        run: |
          mkdir -p "$ANYKERNEL_DIR/tools"

          MODE="${{ inputs.WIFI_TUNING }}"

          # Jika input kosong, gunakan BALANCED
          if [ -z "$MODE" ]; then
              MODE="BALANCED"
          fi

          # Validasi mode
          if [ "$MODE" != "OFF" ] && \
             [ "$MODE" != "BALANCED" ] && \
             [ "$MODE" != "PERFORMANCE" ]; then
              echo "ERROR: WIFI_TUNING tidak valid: $MODE"
              exit 1
          fi

          cat > "$ANYKERNEL_DIR/tools/wifi-tuning.sh" <<EOF
          #!/system/bin/sh

          MODE="$MODE"

          case "\$MODE" in

            OFF)
              exit 0
              ;;

            BALANCED)
              for IFACE in /sys/class/net/wlan*; do
                  [ -d "\$IFACE" ] || continue

                  NAME=\$(basename "\$IFACE")

                  if command -v iw >/dev/null 2>&1; then
                      iw dev "\$NAME" set power_save on 2>/dev/null
                  fi
              done
              ;;

            PERFORMANCE)
              for IFACE in /sys/class/net/wlan*; do
                  [ -d "\$IFACE" ] || continue

                  NAME=\$(basename "\$IFACE")

                  if command -v iw >/dev/null 2>&1; then
                      iw dev "\$NAME" set power_save off 2>/dev/null
                  fi
              done
              ;;

          esac

          exit 0
          EOF

          chmod 755 "$ANYKERNEL_DIR/tools/wifi-tuning.sh"

          echo "=========================================="
          echo "             WIFI TUNING"
          echo "=========================================="
          echo "Selected mode : $MODE"
          echo "=========================================="

      - name: Charger Current Limit
        run: |
          mkdir -p "$ANYKERNEL_DIR/tools"

          MODE="${{ inputs.CHARGE_LIMIT }}"

          if [ -z "$MODE" ]; then
              MODE="900mA"
          fi

          case "$MODE" in
            OFF)
              LIMIT_UA=0
              ;;
            500mA)
              LIMIT_UA=500000
              ;;
            700mA)
              LIMIT_UA=700000
              ;;
            900mA)
              LIMIT_UA=900000
              ;;
            1200mA)
              LIMIT_UA=1200000
              ;;
            *)
              echo "ERROR: CHARGE_LIMIT tidak valid: $MODE"
              exit 1
              ;;
          esac

          cat > "$ANYKERNEL_DIR/tools/charger-limit.sh" <<EOF
          #!/system/bin/sh

          MODE="$MODE"
          LIMIT_UA="$LIMIT_UA"

          # Jangan melakukan apa-apa jika OFF
          if [ "\$MODE" = "OFF" ]; then
              exit 0
          fi

          # Cari power-supply USB yang menyediakan current_max
          for PSY in /sys/class/power_supply/*; do
              [ -d "\$PSY" ] || continue

              TYPE=""
              [ -e "\$PSY/type" ] && TYPE=\$(cat "\$PSY/type" 2>/dev/null)

              case "\$TYPE" in
                  USB|USB_PD|USB_PD_PPS)
                      if [ -e "\$PSY/current_max" ]; then
                          echo "\$LIMIT_UA" > "\$PSY/current_max" 2>/dev/null
                      fi
                      ;;
              esac
          done

          exit 0
          EOF

          chmod 755 "$ANYKERNEL_DIR/tools/charger-limit.sh"

          echo "=========================================="
          echo "        CHARGER CURRENT LIMIT"
          echo "=========================================="
          echo "Mode       : $MODE"
          echo "Limit      : ${LIMIT_UA} uA"
          echo "Limit      : $((LIMIT_UA / 1000)) mA"
          echo "=========================================="

      # ============================================================
      # ADD GAMING ASCII LOGO
      # ============================================================
      - name: Add Gaming ASCII Logo
        working-directory: ${{ env.ANYKERNEL_DIR }}
        shell: bash
        run: |
         set -e

         test -f anykernel.sh

         cp anykernel.sh anykernel.sh.bak
     
         cat > /tmp/gaming_logo.txt <<'EOF'
         ui_print " "
         ui_print " __        __ _   _ ____  _____  ____  "
         ui_print " \ \      / /| | | |  _ \| ____|  _ \ "
         ui_print "  \ \ /\ / / | | | | |_) |  _| | | | |"
         ui_print "   \ V  V /  | |_| |  _ <| |___| |_| |"
         ui_print "    \_/\_/    \___/|_| \_\_____|____/ "
         ui_print " "
         ui_print "       +--------------------------------+"
         ui_print "       |      WHYRED GAMING KERNEL      |"
         ui_print "       |        [ GAME EDITION ]        |"
         ui_print "       |        [ PERFORMANCE ]         |"
         ui_print "       +--------------------------------+"
         ui_print " "
         EOF

         cat /tmp/gaming_logo.txt anykernel.sh > anykernel.sh.new
         mv anykernel.sh.new anykernel.sh

         chmod +x anykernel.sh
          
      # ============================================================
      # PREPARE ANYKERNEL3 KERNEL IMAGE
      # ============================================================
      - name: Prepare AnyKernel3 kernel
        run: |
          set -e

          echo "======================================"
          echo "PREPARE ANYKERNEL3"
          echo "======================================"

          if [ "${{ inputs.LZ4HC }}" = "on" ]; then

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image.lz4"

            test -f "$IMAGE" || {
              echo "ERROR: Image.lz4 tidak ditemukan!"
              exit 1
            }

            cp "$IMAGE" "$ANYKERNEL_DIR/Image.lz4"

            echo "Using: Image.lz4"

          else

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image"

            test -f "$IMAGE" || {
              echo "ERROR: Image tidak ditemukan!"
              exit 1
            }

            cp "$IMAGE" "$ANYKERNEL_DIR/Image"

            echo "Using: Image"

          fi

          echo "=== AnyKernel3 kernel ==="
          ls -lh \
            "$ANYKERNEL_DIR/Image" \
            "$ANYKERNEL_DIR/Image.lz4" 2>/dev/null || true

      # ============================================================
      # AUTOMATIC ZRAM
      # ============================================================
      - name: Add Automatic ZRAM
        if: ${{ inputs.ZRAM }}
        run: |
          set -e

          ZRAM_SCRIPT="$ANYKERNEL_DIR/ramdisk/sbin/zram-auto.sh"

          mkdir -p "$ANYKERNEL_DIR/ramdisk/sbin"

          cat > "$ZRAM_SCRIPT" <<'EOF'
          #!/system/bin/sh

          ZRAM="/sys/block/zram0"

          # Wait for zram device
          i=0
          while [ "$i" -lt 10 ]; do
          [ -d "$ZRAM" ] && break
          sleep 1
          i=$((i + 1))
          done

          # Exit if zram does not exist
          [ -d "$ZRAM" ] || exit 0

          # Detect RAM in MB
          RAM_MB=$(awk '/MemTotal/ {print int($2 / 1024)}' /proc/meminfo)

          # Select zram size
          case "$RAM_MB" in
              ''|*[!0-9]*)
              SIZE_MB=2048
              ;;
          0|1|2|3*)
          SIZE_MB=2048
              ;;
          4*)
          SIZE_MB=2048
              ;;
          5*)
          SIZE_MB=3072
              ;;
          6*)
          SIZE_MB=3072
              ;;
          7*|8*|9*)
          SIZE_MB=4096
              ;;
          *)
          SIZE_MB=6144
              ;;
          esac
 
          # Disable old swap
          swapoff "$ZRAM/dev" 2>/dev/null || true

          # Reset zram
          echo 1 > "$ZRAM/reset" 2>/dev/null || true

          # Select LZ4HC when available
          if [ -f "$ZRAM/comp_algorithm" ]; then
          if grep -qw "lz4hc" "$ZRAM/comp_algorithm"; then
          echo lz4hc > "$ZRAM/comp_algorithm"
          elif grep -qw "lz4" "$ZRAM/comp_algorithm"; then
          echo lz4 > "$ZRAM/comp_algorithm"
          fi
          fi

          # Set zram size
          echo "${SIZE_MB}M" > "$ZRAM/disksize" 2>/dev/null || exit 0
 
          # Create swap
          mkswap "$ZRAM/dev" >/dev/null 2>&1 || exit 0
 
          # Enable swap
          swapon "$ZRAM/dev" -p 32758 >/dev/null 2>&1 || exit 0

          exit 0
          EOF

          chmod 0755 "$ZRAM_SCRIPT"

          echo "======================================"
          echo "AUTOMATIC ZRAM"
          echo "======================================"

          ls -lh "$ZRAM_SCRIPT"

          echo "Checking syntax..."
          sh -n "$ZRAM_SCRIPT"

          echo "ZRAM SCRIPT: OK"

      # ============================================================
      # PACKAGE ANYKERNEL3
      # ============================================================
      - name: Package flashable ZIP
        run: |
          set -e

          cd "$ANYKERNEL_DIR"

          test -f Image.lz4

          zip -r9 \
            "$GITHUB_WORKSPACE/Whyred-Kernel-LZ4HC-${GITHUB_RUN_NUMBER}.zip" \
            . \
            -x ".git/*"

          echo "======================================"
          echo "ANYKERNEL3 ZIP CREATED"
          echo "======================================"

          ls -lh \
            "$GITHUB_WORKSPACE/Whyred-Kernel-LZ4HC-${GITHUB_RUN_NUMBER}.zip"
      

      # ============================================================
      # CCACHE
      # ============================================================
      - name: ccache statistics
        run: |
          ccache -s || true

      # ============================================================
      # UPLOAD IMAGE
      # ============================================================
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-Kernel-Image
          path: kernel-output/

      # ============================================================
      # UPLOAD ZIP
      # ============================================================
      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-Kernel-AnyKernel3
          path: Whyred-Kernel-*.zip
