name: Build Whyred Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Pilih branch source kernel
        required: true
        default: kernel-hmp
        type: choice
        options:
          - kernel-hmp
          - susfs-4.4.271
        

      kernel_name:
          description: "Nama kernel"
          required: true
          default: "SPECTRA"
          type: string

      kernel_version:
          description: "Versi kernel"
          required: true
          default: "v1.0"
          type: string

      clean_build:
        description: Clean build
        required: true
        default: true
        type: boolean

      CHARGE_LIMIT:
        description: "USB Charging Current Limit"
        required: true
        default: "900mA"
        type: choice
        options:
          - OFF
          - 500mA
          - 700mA
          - 900mA
          - 1200mA

      LTO:
        description: "Enable Proton Clang LTO"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

      LZ4HC:
        description: "Compress kernel with LZ4HC"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

      NETWORK:
        description: "Network/TCP tuning"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "westwood"
          - "cubic"
          - "bbr"

      WIFI_TUNING:
        description: "Wi-Fi Tuning"
        required: true
        default: "BALANCED"
        type: choice
        options:
          - OFF
          - BALANCED
          - PERFORMANCE

      VM_TUNING:
        description: "Pilih VM / Memory Tuning"
        required: true
        default: "BALANCED"
        type: choice
        options:
          - OFF
          - BALANCED
          - PERFORMANCE

      CPU_OC:
        description: "Enable CPU Overclock 2.304 GHz"
        required: true
        default: "OFF"
        type: choice
        options:
          - "OFF"
          - "ON"
        
      ZRAM:
        description: "Enable automatic ZRAM"
        required: true
        default: "ON"
        type: choice
        options:
          - ON
          - OFF

      ROOT_MANAGER:
        description: "Pilih Root Manager"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - kernelsu
          - sukisu
          - apatch
          - resukisu
          - mambosu
          - ksun

      SUSFS:
        description: "Enable SUSFS"
        required: true
        default: "OFF"
        type: choice
        options:
          - ON
          - OFF

jobs:
  build:
    name: Whyred Kernel
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/cokocip12/android_kernel_xiaomi_whyred
      KERNEL_BRANCH: ${{ inputs.branch }}

      ARCH: arm64
      SUBARCH: arm64

      DEFCONFIG: whyred_defconfig
      
      BUILD_DIR: ${{ github.workspace }}/out
      KERNEL_DIR: ${{ github.workspace }}/kernel
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3

      # Fix GCC outline atomics
      KCFLAGS: -mno-outline-atomics

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: cokocip12/android_kernel_xiaomi_whyred
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          path: kernel


      - name: Setup Clang 12.0.5
        run: |
         set -e

         TOOLCHAIN_DIR="$HOME/clang-r416183b"

         rm -rf "$TOOLCHAIN_DIR"

         git clone --depth=1 \
         --branch android12-release \
         https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
         "$TOOLCHAIN_DIR"
 
         echo "$TOOLCHAIN_DIR/clang-r416183b/bin" >> "$GITHUB_PATH"

         echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
         echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
         echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

         clang --version

      # ============================================================
      # DEPENDENCIES + BOTH TOOLCHAINS
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            wget \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Configure Clang
        shell: bash
        run: |
         export CLANG_DIR="/home/runner/clang-r416183b/clang-r416183b"

         echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
         echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

         echo "CC=clang" >> "$GITHUB_ENV"
         echo "LD=ld.lld" >> "$GITHUB_ENV"
         echo "LLVM=1" >> "$GITHUB_ENV"
         echo "LLVM_IAS=1" >> "$GITHUB_ENV"

         echo "===== CLANG ====="
         which clang
         clang --version

         echo "===== LLD ====="
         which ld.lld
         ld.lld --version


      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Setup toolchains
        run: |
          echo "======================================"
          echo "AARCH64 TOOLCHAIN"
          echo "======================================"

          aarch64-linux-gnu-gcc --version

          echo ""
          echo "======================================"
          echo "ARM32 TOOLCHAIN"
          echo "======================================"

          arm-linux-gnueabi-gcc --version

          echo ""
          echo "======================================"
          echo "SETTING CROSS COMPILE"
          echo "======================================"

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      - name: Install KernelSU
        if: ${{ inputs.ROOT_MANAGER == 'kernelsu' }}
        working-directory: kernel
        run: |
         echo "Installing KernelSU..."
         curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -
  
      - name: Install SukiSU-Ultra
        if: ${{ inputs.ROOT_MANAGER == 'sukisu' }}
        working-directory: kernel
        run: |
         echo "Installing SukiSU-Ultra..."
         curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -

      - name: Install ReSukiSU
        if: ${{ inputs.ROOT_MANAGER == 'resukisu' }}
        working-directory: kernel
        run: |
         echo "Installing ReSukiSU..."
         curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -

      - name: Install MamboSU
        if: ${{ inputs.ROOT_MANAGER == 'mambosu' }}
        working-directory: kernel
        run: |
         echo "Installing MamboSU..."
         curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -master

      - name: Install KernelSU Next
        if: ${{ inputs.ROOT_MANAGER == 'ksun' }}
        working-directory: kernel
        run: |
         echo "=== Installing KernelSU Next ==="

         curl -LSs \
         "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
      
      # ============================================================
      # CCACHE
      # ============================================================
      - name: Setup ccache
        run: |
          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: whyred-kernel-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            whyred-kernel-${{ runner.os }}-

      # ============================================================
      # CLEAN BUILD
      # ============================================================
      - name: Clean build
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf "$BUILD_DIR"

      # ============================================================
      # CHECK SOURCE
      # ============================================================
      - name: Check kernel source
        working-directory: kernel
        run: |
          echo "======================================"
          echo "KERNEL SOURCE"
          echo "======================================"

          git log -1 --oneline

          echo ""
          echo "Kernel version:"
          make kernelversion

          echo ""
          echo "Defconfig:"
          test -f "arch/arm64/configs/${DEFCONFIG}"

          echo "FOUND: arch/arm64/configs/${DEFCONFIG}"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure Kernel
        shell: bash
        working-directory: kernel
        run: |
         set -e

         echo "=== Loading Whyred defconfig ==="
         make ARCH=arm64 whyred_defconfig

         echo "=== Enable KernelSU ==="        
         scripts/config --enable CONFIG_OVERLAY_FS
         scripts/config --enable CONFIG_KSU
         scripts/config --enable CONFIG_KSU_DEBUG

         echo "=== Update kernel config ==="
         make ARCH=arm64 olddefconfig

         echo "=== KernelSU Config ==="
         grep -nE '^CONFIG_(OVERLAY_FS|KSU|KSU_DEBUG)=' .config

      - name: Enable ZRAM
        if: ${{ inputs.ZRAM }}
        working-directory: kernel
        run: |
         set -e

         test -f "$BUILD_DIR/.config" || {
         echo "ERROR: $BUILD_DIR/.config tidak ditemukan"
         exit 1
         }

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_ZRAM

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_ZSMALLOC

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== ZRAM CONFIG ==="
         grep -E '^CONFIG_ZRAM=|^CONFIG_ZSMALLOC=' \
         "$BUILD_DIR/.config" || true

      - name: Configure KALLSYMS for APatch
        if: ${{ inputs.ROOT_MANAGER == 'apatch' }}
        working-directory: kernel
        run: |
         echo "Configuring KALLSYMS..."

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS_ALL
 
         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== KALLSYMS CONFIG ==="
         grep -E '^CONFIG_KALLSYMS(=|_)' "$BUILD_DIR/.config" || true

      - name: Configure KernelSU
        if: ${{ inputs.ROOT_MANAGER == 'kernelsu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure SukiSU-Ultra
        if: ${{ inputs.ROOT_MANAGER == 'sukisu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure ReSukiSU
        if: ${{ inputs.ROOT_MANAGER == 'resukisu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure MamboSU
        if: ${{ inputs.ROOT_MANAGER == 'mambosu' }}
        working-directory: kernel
        run: |
         echo "=== Configuring MamboSU ==="

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KSU

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== MamboSU configuration ==="
         grep -E '^CONFIG_KSU(=|_)' "$BUILD_DIR/.config" || true

      - name: Configure KernelSU Next
        if: ${{ inputs.ROOT_MANAGER == 'ksun' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      # APatch
      - name: Configure APatch
        if: ${{ inputs.ROOT_MANAGER == 'apatch' }}
        working-directory: kernel
        run: |
         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS_ALL

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

      # ==========================================
      # CONFIGURE CPU OC
      # ==========================================
      - name: Configure CPU OC
        working-directory: kernel
        shell: bash
        env:
          CPU_OC: ${{ inputs.CPU_OC }}
        run: |
          set -e

          echo "========================================"
          echo "       SPECTRA CPU CONFIGURATION"
          echo "========================================"
          echo "CPU_OC: $CPU_OC"
          echo "Target : 2.304 GHz"
          echo "========================================"
 
          if [ "$CPU_OC" = "ON" ]; then

            echo ""
            echo "CPU OC ENABLED"
            echo "Target frequency: 2304000 kHz"

            # Cari frequency 2.304 GHz yang sudah ada
            # di source/device tree.
            if grep -Rni "2304000" \
                arch/arm64/boot/dts/qcom \
                2>/dev/null; then

              echo ""
              echo "2.304 GHz frequency entry FOUND."

            else

              echo ""
              echo "ERROR: 2304000 kHz entry tidak ditemukan!"
              echo "Tidak melakukan perubahan frekuensi."
              exit 1

            fi

            elif [ "$CPU_OC" = "OFF" ]; then

              echo ""
              echo "CPU OC DISABLED"
              echo "Using stock CPU frequency."

            else

              echo ""
              echo "ERROR: Invalid CPU_OC value: '$CPU_OC'"
              exit 1

             fi

             echo ""
             echo "CPU configuration completed."

      # ============================================================
      # NETWORK / TCP TUNING
      # ============================================================
      - name: Configure Network Tuning
        if: ${{ inputs.NETWORK != 'off' }}
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "NETWORK / TCP TUNING"
          echo "======================================"

          NETWORK="${{ inputs.NETWORK }}"

          echo "Selected profile: $NETWORK"

          case "$NETWORK" in

            westwood)
              echo "Using TCP Westwood"

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_ADVANCED

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_WESTWOOD

              scripts/config --file "$BUILD_DIR/.config" \
                --set-str CONFIG_DEFAULT_TCP_CONG "westwood"
              ;;

            cubic)
              echo "Using TCP CUBIC"

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_ADVANCED

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_CUBIC

              scripts/config --file "$BUILD_DIR/.config" \
                --set-str CONFIG_DEFAULT_TCP_CONG "cubic"
              ;;

            bbr)
              echo "Using BBR + FQ"

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_ADVANCED

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_TCP_CONG_BBR

              scripts/config --file "$BUILD_DIR/.config" \
                --enable CONFIG_NET_SCH_FQ

              scripts/config --file "$BUILD_DIR/.config" \
                --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
              ;;

            *)
              echo "ERROR: Unknown network profile: $NETWORK"
              exit 1
              ;;
          esac

          echo ""
          echo "=== FINAL TCP CONFIG ==="

          grep -E \
            'CONFIG_TCP_CONG_|CONFIG_NET_SCH_FQ|CONFIG_DEFAULT_TCP_CONG' \
            "$BUILD_DIR/.config" || true

          echo ""
          echo "Network tuning configured successfully."

      # ============================================================
      # FINAL ROOT MANAGER + SUSFS CHECK
      # ============================================================
      - name: Verify Root Manager and SUSFS
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL ROOT / SUSFS CONFIG"
          echo "======================================"
          echo "Root manager : ${{ inputs.ROOT_MANAGER }}"
          echo "SUSFS        : ${{ inputs.SUSFS }}"

          test -f "$BUILD_DIR/.config"

          case "${{ inputs.ROOT_MANAGER }}" in
            kernelsu|sukisu|resukisu|mambosu|ksun)
              grep -E '^CONFIG_KSU(=|_)' "$BUILD_DIR/.config" || true
              ;;
            apatch)
              grep -E '^CONFIG_KALLSYMS(=|_)' "$BUILD_DIR/.config" || true
              ;;
          esac

          if [ "${{ inputs.SUSFS }}" = "ON" ]; then
            grep -q '^CONFIG_KSU_SUSFS=y$' "$BUILD_DIR/.config" || {
              echo "ERROR: SUSFS=ON but CONFIG_KSU_SUSFS is not enabled."
              exit 1
            }
            echo "SUSFS: ENABLED"
          else
            if grep -qE '^CONFIG_KSU_SUSFS(=|_)' "$BUILD_DIR/.config"; then
              echo "ERROR: SUSFS=OFF but SUSFS config remains enabled."
              exit 1
            fi
            echo "SUSFS: DISABLED"
          fi

      - name: Check Clang 12.0.5
        run: |
         set -x

         echo "=== ENV ==="
         echo "PATH=$PATH"
         echo "CC=$CC"
         echo "LLVM=$LLVM"
         echo "CLANG_DIR=$CLANG_DIR"
 
         echo "=== CLANG ==="
         which clang
         clang --version

         echo "=== LLVM TOOLS ==="
         which ld.lld || true
         ld.lld --version || true

         echo "=== CLANG DIRECTORY ==="
         ls -lah "$CLANG_DIR/bin"
         

      - name: Find Whyred defconfig
        shell: bash
        run: |
         set -e
    
         echo "===== KERNEL SOURCE ====="
         echo "$KERNEL_DIR"

         test -d "$KERNEL_DIR/arch/arm64" || {
         echo "ERROR: arch/arm64 tidak ditemukan!"
         exit 1
         }

         echo "===== WHYRED DEFCONFIG ====="

         find "$KERNEL_DIR/arch/arm64/configs" \
         -maxdepth 1 \
         -type f \
         -name '*whyred*' \
         -print

         test -f "$KERNEL_DIR/arch/arm64/configs/whyred_defconfig" || {
         echo "ERROR: whyred_defconfig tidak ditemukan!"
         exit 1
         }

         echo "FOUND:"
         echo "$KERNEL_DIR/arch/arm64/configs/whyred_defconfig"

      # ============================================================
      # BUILD RAW KERNEL
      # ============================================================
      
      - name: Build Kernel
        shell: bash
        run: |
         set -e

         cd "$KERNEL_DIR"

         export PATH="$CLANG_DIR/bin:$PATH"

         echo "===== TOOLCHAIN ====="
         which clang
         clang --version

         which aarch64-linux-gnu-ld
         aarch64-linux-gnu-ld --version

         echo "===== DEFCONFIG ====="
   
         make O="$BUILD_DIR" \
         ARCH=arm64 \
         CROSS_COMPILE=aarch64-linux-gnu- \
         CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
         CC=clang \
         LLVM=1 \
         LLVM_IAS=1 \
         whyred_defconfig
  
         echo "===== BUILD ====="

         make -j"$(nproc)" \
         O="$BUILD_DIR" \
         ARCH=arm64 \
         CROSS_COMPILE=aarch64-linux-gnu- \
         CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
         CC=clang \
         LLVM=1 \
         LLVM_IAS=1

      # ============================================================
      # LZ4HC OPTIONAL
      # ============================================================
      - name: Compress kernel with LZ4HC
        if: ${{ inputs.LZ4HC == 'on' }}
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LZ4HC: ON"
          echo "======================================"

          IMAGE="$BUILD_DIR/arch/arm64/boot/Image"

          test -f "$IMAGE" || {
            echo "ERROR: Image tidak ditemukan!"
            exit 1
          }

          sudo apt-get update
          sudo apt-get install -y lz4

          lz4 -9 -f \
            "$IMAGE" \
            "$BUILD_DIR/arch/arm64/boot/Image.lz4"

          echo "=== LZ4HC RESULT ==="
          ls -lh \
            "$IMAGE" \
            "$BUILD_DIR/arch/arm64/boot/Image.lz4"


      - name: LZ4HC OFF
        if: ${{ inputs.LZ4HC == 'off' }}
        run: |
          echo "======================================"
          echo "LZ4HC: OFF"
          echo "======================================"
          echo "Using normal Image"
          
      # ============================================================
      # CHECK OUTPUT
      # ============================================================
      - name: Check kernel image
        run: |
          set -e

          echo "======================================"
          echo "KERNEL OUTPUT"
          echo "======================================"

          ls -lh "$BUILD_DIR/arch/arm64/boot/"

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Image.gz-dtb FOUND"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "Image.gz FOUND"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image" ]; then
            echo "Image FOUND"

          else
            echo "ERROR: Kernel image not found"
            exit 1
          fi

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare kernel image
        run: |
          set -e

          mkdir -p kernel-output

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" \
              kernel-output/Image.gz-dtb

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz" \
              kernel-output/Image.gz

          else
            cp "$BUILD_DIR/arch/arm64/boot/Image" \
              kernel-output/Image
          fi

          cp "$BUILD_DIR/.config" \
            kernel-output/kernel.config

          ls -lh kernel-output

      # ============================================================
      # ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          git clone \
            --depth=1 \
            -b whyred \
            https://github.com/d1aznr/AnyKernel3.git \
            "$ANYKERNEL_DIR"

      - name: VM Tuning
        run: |
          mkdir -p "$ANYKERNEL_DIR/tools"

          MODE="${{ inputs.VM_TUNING }}"

          # Jika input kosong, gunakan BALANCED
          if [ -z "$MODE" ]; then
              MODE="BALANCED"
          fi

          # Validasi mode
          if [ "$MODE" != "OFF" ] && \
             [ "$MODE" != "BALANCED" ] && \
             [ "$MODE" != "PERFORMANCE" ]; then
              echo "ERROR: VM_TUNING tidak valid: $MODE"
              exit 1
          fi

          cat > "$ANYKERNEL_DIR/tools/vm-tuning.sh" <<EOF
          #!/system/bin/sh

          MODE="$MODE"

          setval() {
              if [ -e "\$1" ]; then
                  echo "\$2" > "\$1" 2>/dev/null
              fi
          }

          case "\$MODE" in

            OFF)
              exit 0
              ;;

            BALANCED)
              setval /proc/sys/vm/swappiness 20
              setval /proc/sys/vm/dirty_ratio 15
              setval /proc/sys/vm/dirty_background_ratio 5
              setval /proc/sys/vm/dirty_expire_centisecs 3000
              setval /proc/sys/vm/dirty_writeback_centisecs 1500
              setval /proc/sys/vm/vfs_cache_pressure 75
              setval /proc/sys/vm/page-cluster 0
              ;;

            PERFORMANCE)
              setval /proc/sys/vm/swappiness 10
              setval /proc/sys/vm/dirty_ratio 20
              setval /proc/sys/vm/dirty_background_ratio 5
              setval /proc/sys/vm/dirty_expire_centisecs 2000
              setval /proc/sys/vm/dirty_writeback_centisecs 1000
              setval /proc/sys/vm/vfs_cache_pressure 50
              setval /proc/sys/vm/page-cluster 0
              ;;

          esac

          exit 0
          EOF

          chmod 755 "$ANYKERNEL_DIR/tools/vm-tuning.sh"

          echo "=========================================="
          echo "              VM TUNING"
          echo "=========================================="
          echo "Selected mode : $MODE"
          echo "=========================================="

      - name: WiFi Tuning
        run: |
          mkdir -p "$ANYKERNEL_DIR/tools"

          MODE="${{ inputs.WIFI_TUNING }}"

          # Jika input kosong, gunakan BALANCED
          if [ -z "$MODE" ]; then
              MODE="BALANCED"
          fi

          # Validasi mode
          if [ "$MODE" != "OFF" ] && \
             [ "$MODE" != "BALANCED" ] && \
             [ "$MODE" != "PERFORMANCE" ]; then
              echo "ERROR: WIFI_TUNING tidak valid: $MODE"
              exit 1
          fi

          cat > "$ANYKERNEL_DIR/tools/wifi-tuning.sh" <<EOF
          #!/system/bin/sh

          MODE="$MODE"

          case "\$MODE" in

            OFF)
              exit 0
              ;;

            BALANCED)
              for IFACE in /sys/class/net/wlan*; do
                  [ -d "\$IFACE" ] || continue

                  NAME=\$(basename "\$IFACE")

                  if command -v iw >/dev/null 2>&1; then
                      iw dev "\$NAME" set power_save on 2>/dev/null
                  fi
              done
              ;;

            PERFORMANCE)
              for IFACE in /sys/class/net/wlan*; do
                  [ -d "\$IFACE" ] || continue

                  NAME=\$(basename "\$IFACE")

                  if command -v iw >/dev/null 2>&1; then
                      iw dev "\$NAME" set power_save off 2>/dev/null
                  fi
              done
              ;;

          esac

          exit 0
          EOF

          chmod 755 "$ANYKERNEL_DIR/tools/wifi-tuning.sh"

          echo "=========================================="
          echo "             WIFI TUNING"
          echo "=========================================="
          echo "Selected mode : $MODE"
          echo "=========================================="

      - name: Charger Current Limit
        run: |
          mkdir -p "$ANYKERNEL_DIR/tools"

          MODE="${{ inputs.CHARGE_LIMIT }}"

          if [ -z "$MODE" ]; then
              MODE="900mA"
          fi

          case "$MODE" in
            OFF)
              LIMIT_UA=0
              ;;
            500mA)
              LIMIT_UA=500000
              ;;
            700mA)
              LIMIT_UA=700000
              ;;
            900mA)
              LIMIT_UA=900000
              ;;
            1200mA)
              LIMIT_UA=1200000
              ;;
            *)
              echo "ERROR: CHARGE_LIMIT tidak valid: $MODE"
              exit 1
              ;;
          esac

          cat > "$ANYKERNEL_DIR/tools/charger-limit.sh" <<EOF
          #!/system/bin/sh

          MODE="$MODE"
          LIMIT_UA="$LIMIT_UA"

          # Jangan melakukan apa-apa jika OFF
          if [ "\$MODE" = "OFF" ]; then
              exit 0
          fi

          # Cari power-supply USB yang menyediakan current_max
          for PSY in /sys/class/power_supply/*; do
              [ -d "\$PSY" ] || continue

              TYPE=""
              [ -e "\$PSY/type" ] && TYPE=\$(cat "\$PSY/type" 2>/dev/null)

              case "\$TYPE" in
                  USB|USB_PD|USB_PD_PPS)
                      if [ -e "\$PSY/current_max" ]; then
                          echo "\$LIMIT_UA" > "\$PSY/current_max" 2>/dev/null
                      fi
                      ;;
              esac
          done

          exit 0
          EOF

          chmod 755 "$ANYKERNEL_DIR/tools/charger-limit.sh"

          echo "=========================================="
          echo "        CHARGER CURRENT LIMIT"
          echo "=========================================="
          echo "Mode       : $MODE"
          echo "Limit      : ${LIMIT_UA} uA"
          echo "Limit      : $((LIMIT_UA / 1000)) mA"
          echo "=========================================="
          
      # ============================================================
      # PREPARE ANYKERNEL3 KERNEL IMAGE
      # ============================================================
      - name: Prepare AnyKernel3 kernel
        run: |
          set -e

          echo "======================================"
          echo "PREPARE ANYKERNEL3"
          echo "======================================"

          if [ "${{ inputs.LZ4HC }}" = "on" ]; then

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image.lz4"

            test -f "$IMAGE" || {
              echo "ERROR: Image.lz4 tidak ditemukan!"
              exit 1
            }

            cp "$IMAGE" "$ANYKERNEL_DIR/Image.lz4"

            echo "Using: Image.lz4"

          else

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image"

            test -f "$IMAGE" || {
              echo "ERROR: Image tidak ditemukan!"
              exit 1
            }

            cp "$IMAGE" "$ANYKERNEL_DIR/Image"

            echo "Using: Image"

          fi

          echo "=== AnyKernel3 kernel ==="
          ls -lh \
            "$ANYKERNEL_DIR/Image" \
            "$ANYKERNEL_DIR/Image.lz4" 2>/dev/null || true

      # ==========================================
      # ZRAM ON/OFF
      # ==========================================
      - name: Configure ZRAM
        shell: bash
        env:
          ZRAM_MODE: ${{ inputs.ZRAM }}
        run: |
          set -e

          echo "========================================"
          echo "        SPECTRA ZRAM CONFIG"
          echo "========================================"
          echo "Mode: $ZRAM_MODE"
          echo "========================================"

          mkdir -p AnyKernel3/zram

          if [ "$ZRAM_MODE" = "ON" ]; then

            echo "Automatic ZRAM: ENABLED"

            cat > AnyKernel3/zram/zram-auto.sh <<'EOF'
          #!/system/bin/sh

          ZRAM="/sys/block/zram0"

          # ZRAM harus tersedia
          [ -d "$ZRAM" ] || exit 0

          # Ambil RAM dalam MB
          RAM_MB=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)

          # ==========================================
          # SPECTRA ZRAM PROFILE
          # ==========================================

          if [ "$RAM_MB" -le 3584 ]; then
              # 3 GB RAM
              ZRAM_MB=2048

          elif [ "$RAM_MB" -le 5120 ]; then
              # 4 GB RAM
              ZRAM_MB=2048

          elif [ "$RAM_MB" -le 7168 ]; then
              # 6 GB RAM
              ZRAM_MB=3072

          else
              # 8 GB+
              ZRAM_MB=4096
          fi

          ZRAM_SIZE=$((ZRAM_MB * 1024 * 1024))

          # Stop existing swap
          swapoff "$ZRAM" 2>/dev/null || true

          # Reset ZRAM
          echo 1 > "$ZRAM/reset" 2>/dev/null || true

          # Set ZRAM size
          echo "$ZRAM_SIZE" > "$ZRAM/disksize" || exit 1

          # Initialize swap
          mkswap "$ZRAM" >/dev/null 2>&1 || exit 1

          # Enable swap
          swapon -p 32758 "$ZRAM" || exit 1

          exit 0
          EOF

            chmod 755 AnyKernel3/zram/zram-auto.sh

            # --------------------------------------
            # Create boot service
            # --------------------------------------

            cat > AnyKernel3/zram/service.sh <<'EOF'
          #!/system/bin/sh

          SCRIPT="/data/adb/spectra-zram/zram-auto.sh"

          if [ -f "$SCRIPT" ]; then
              sh "$SCRIPT"
          fi
          EOF

            chmod 755 AnyKernel3/zram/service.sh

            echo "ZRAM configuration created."

          else

            echo "Automatic ZRAM: DISABLED"

            rm -rf AnyKernel3/zram

          fi

      # ==========================================
      # CREATE ZRAM INSTALLER
      # ==========================================
      - name: Create ZRAM installer
        env:
          ZRAM_MODE: ${{ inputs.ZRAM }}
        run: |
          set -e

          if [ "$ZRAM_MODE" = "ON" ]; then

            mkdir -p AnyKernel3/zram-module

            cat > AnyKernel3/zram-module/module.prop <<'EOF'
          id=spectra-zram
          name=SPECTRA Automatic ZRAM
          version=1.0
          versionCode=1
          author=RENZVERSE
          description=Automatic ZRAM profile for Whyred
          EOF

            mkdir -p AnyKernel3/zram-module/system/bin

            cp \
              AnyKernel3/zram/zram-auto.sh \
              AnyKernel3/zram-module/service.sh

            chmod 755 \
              AnyKernel3/zram-module/service.sh

          fi
      
      # ============================================================
      # PACKAGE ANYKERNEL3
      # ============================================================
      - name: Package flashable ZIP
        run: |
          set -e

          echo "======================================"
          echo "PACKAGING SPECTRA ANYKERNEL3"
          echo "======================================"

          cd "$ANYKERNEL_DIR"

          # Bersihkan kernel image lama
          rm -f Image Image.lz4 Image.gz Image.gz-dtb

          # ========================================================
          # COPY KERNEL SESUAI PILIHAN LZ4HC
          # ========================================================

          if [ "${{ inputs.LZ4HC }}" = "on" ]; then

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image.lz4"

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Image.lz4 tidak ditemukan!"
              exit 1
            fi

            cp "$IMAGE" "$ANYKERNEL_DIR/Image.lz4"

            echo "Kernel image : Image.lz4"
            echo "LZ4HC        : ON"

          else

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image"

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Image tidak ditemukan!"
              exit 1
            fi

            cp "$IMAGE" "$ANYKERNEL_DIR/Image"

            echo "Kernel image : Image"
            echo "LZ4HC        : OFF"

          fi

          # ========================================================
          # VERIFY ANYKERNEL3
          # ========================================================

          test -f anykernel.sh

          echo ""
          echo "ANYKERNEL3 CONTENT:"
          ls -lh Image* 2>/dev/null || true
          ls -lh anykernel.sh

          # ========================================================
          # KERNEL NAME
          # ========================================================

          ZIP_NAME="${KERNEL_NAME:-SPECTRA-Kernel}"

          # Hilangkan karakter aneh untuk nama ZIP
          ZIP_NAME=$(echo "$ZIP_NAME" | sed 's/^-//')

          FINAL_ZIP="${ZIP_NAME}-${GITHUB_RUN_NUMBER}.zip"

          # ========================================================
          # CREATE ZIP
          # ========================================================

          echo ""
          echo "Creating:"
          echo "$FINAL_ZIP"

          zip -r9 \
            "$GITHUB_WORKSPACE/$FINAL_ZIP" \
            . \
            -x ".git/*" \
            -x "*.github/*" \
            -x "README.md"

          # ========================================================
          # VERIFY ZIP
          # ========================================================

          if [ ! -f "$GITHUB_WORKSPACE/$FINAL_ZIP" ]; then
            echo "ERROR: ZIP gagal dibuat!"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "SPECTRA ANYKERNEL3 ZIP CREATED"
          echo "======================================"
          echo "ZIP : $FINAL_ZIP"
          echo "SIZE:"
          ls -lh "$GITHUB_WORKSPACE/$FINAL_ZIP"

          echo ""
          echo "ZIP CONTENT:"
          unzip -l "$GITHUB_WORKSPACE/$FINAL_ZIP" | head -40

          echo ""
          echo "======================================"
          echo "PACKAGE SUCCESS"
          echo "======================================"
      

      # ============================================================
      # CCACHE
      # ============================================================
      - name: ccache statistics
        run: |
          ccache -s || true

      - name: Prepare kernel image
        run: |
         set -e

         mkdir -p kernel-output

         if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
         cp "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" \
         kernel-output/Image.gz-dtb

         elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
         cp "$BUILD_DIR/arch/arm64/boot/Image.gz" \
         kernel-output/Image.gz

         elif [ -f "$BUILD_DIR/arch/arm64/boot/Image" ]; then
         cp "$BUILD_DIR/arch/arm64/boot/Image" \
         kernel-output/Image

         else
         echo "ERROR: Kernel image tidak ditemukan!"
         exit 1
         fi

         cp "$BUILD_DIR/.config" \
         kernel-output/kernel.config

         echo "=== KERNEL OUTPUT ==="
         ls -lh kernel-output

      # ============================================================
      # UPLOAD IMAGE
      # ============================================================
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel-output/Image

      # ============================================================
      # UPLOAD ANYKERNEL3 ZIP
      # ============================================================
      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRA-Kernel
          path: "*.zip"
          if-no-files-found: error
