name: Build Whyred Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Pilih branch source kernel
        required: true
        default: kernel-hmp
        type: choice
        options:
          - kernel-hmp
          - susfs-4.4.271
        

      kernel_name:
          description: "Nama kernel"
          required: true
          default: "SPECTRA"
          type: string

      kernel_version:
          description: "Versi kernel"
          required: true
          default: "v1.0"
          type: string

      clean_build:
        description: Clean build
        required: true
        default: true
        type: boolean    

      LTO:
        description: "Enable Clang LTO"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

      LZ4HC:
        description: "Compress kernel with LZ4HC"
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"                         

      ROOT_MANAGER:
        description: "Pilih Root Manager"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - kernelsu
          - sukisu
          - apatch
          - resukisu
          - mambosu
          - ksun

      SUSFS:
        description: "Enable SUSFS"
        required: true
        default: "OFF"
        type: choice
        options:
          - ON
          - OFF

jobs:
  build:
    name: Whyred Kernel
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/cokocip12/android_kernel_xiaomi_whyred
      KERNEL_BRANCH: ${{ inputs.branch }}

      ARCH: arm64
      SUBARCH: arm64

      DEFCONFIG: whyred_defconfig
      
      BUILD_DIR: ${{ github.workspace }}/out
      KERNEL_DIR: ${{ github.workspace }}/kernel
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3

      # Fix GCC outline atomics
      KCFLAGS: -mno-outline-atomics

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: cokocip12/android_kernel_xiaomi_whyred
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          path: kernel


      - name: Setup Clang 12.0.5
        run: |
         set -e

         TOOLCHAIN_DIR="$HOME/clang-r416183b"

         rm -rf "$TOOLCHAIN_DIR"

         git clone --depth=1 \
         --branch android12-release \
         https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
         "$TOOLCHAIN_DIR"
 
         echo "$TOOLCHAIN_DIR/clang-r416183b/bin" >> "$GITHUB_PATH"

         echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
         echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
         echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

         clang --version

      # ============================================================
      # DEPENDENCIES + BOTH TOOLCHAINS
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            wget \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Configure Clang
        shell: bash
        run: |
         export CLANG_DIR="/home/runner/clang-r416183b/clang-r416183b"

         echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
         echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

         echo "CC=clang" >> "$GITHUB_ENV"
         echo "LD=ld.lld" >> "$GITHUB_ENV"
         echo "LLVM=1" >> "$GITHUB_ENV"
         echo "LLVM_IAS=1" >> "$GITHUB_ENV"

         echo "===== CLANG ====="
         which clang
         clang --version

         echo "===== LLD ====="
         which ld.lld
         ld.lld --version


      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Setup toolchains
        run: |
          echo "======================================"
          echo "AARCH64 TOOLCHAIN"
          echo "======================================"

          aarch64-linux-gnu-gcc --version

          echo ""
          echo "======================================"
          echo "ARM32 TOOLCHAIN"
          echo "======================================"

          arm-linux-gnueabi-gcc --version

          echo ""
          echo "======================================"
          echo "SETTING CROSS COMPILE"
          echo "======================================"

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      - name: Install KernelSU
        if: ${{ inputs.ROOT_MANAGER == 'kernelsu' }}
        working-directory: kernel
        run: |
         echo "Installing KernelSU..."
         curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -
  
      # ============================================================
      # CCACHE
      # ============================================================
      - name: Setup ccache
        run: |
          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: whyred-kernel-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            whyred-kernel-${{ runner.os }}-

      # ============================================================
      # CLEAN BUILD
      # ============================================================
      - name: Clean build
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf "$BUILD_DIR"

      # ============================================================
      # CHECK SOURCE
      # ============================================================
      - name: Check kernel source
        working-directory: kernel
        run: |
          echo "======================================"
          echo "KERNEL SOURCE"
          echo "======================================"

          git log -1 --oneline

          echo ""
          echo "Kernel version:"
          make kernelversion

          echo ""
          echo "Defconfig:"
          test -f "arch/arm64/configs/${DEFCONFIG}"

          echo "FOUND: arch/arm64/configs/${DEFCONFIG}"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure Kernel
        shell: bash
        working-directory: kernel
        run: |
         set -e

         echo "=== Loading Whyred defconfig ==="

         make O="$BUILD_DIR" \
         ARCH=arm64 \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         CC=clang \
         LLVM=1 \
         LLVM_IAS=1 \
         whyred_defconfig

         echo "=== Enable KernelSU ==="

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_OVERLAY_FS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KSU

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KSU_DEBUG

         echo "=== Update kernel config ==="

         make O="$BUILD_DIR" \
         ARCH=arm64 \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         CC=clang \
         LLVM=1 \
         LLVM_IAS=1 \
         olddefconfig

         echo "=== KernelSU Config ==="

         grep -nE '^CONFIG_(OVERLAY_FS|KSU|KSU_DEBUG)=' \
         "$BUILD_DIR/.config"

      - name: Configure LTO
        working-directory: kernel
        shell: bash
        run: |
          set -e

          if [ "${{ inputs.LTO }}" = "on" ]; then
            echo "======================================"
            echo "LTO: ON"
            echo "======================================"

            scripts/config --file "$BUILD_DIR/.config" \
              --enable CONFIG_LTO_CLANG

            scripts/config --file "$BUILD_DIR/.config" \
              --enable CONFIG_LTO_CLANG_THIN

            scripts/config --file "$BUILD_DIR/.config" \
              --disable CONFIG_LTO_CLANG_FULL
          else
            echo "======================================"
            echo "LTO: OFF"
            echo "======================================"

            scripts/config --file "$BUILD_DIR/.config" \
              --disable CONFIG_LTO_CLANG

            scripts/config --file "$BUILD_DIR/.config" \
              --disable CONFIG_LTO_CLANG_THIN

            scripts/config --file "$BUILD_DIR/.config" \
              --disable CONFIG_LTO_CLANG_FULL
          fi

          make O="$BUILD_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo "=== FINAL LTO CONFIG ==="
          grep -E '^CONFIG_LTO' "$BUILD_DIR/.config" || true

      
      - name: Configure KALLSYMS for APatch
        if: ${{ inputs.ROOT_MANAGER == 'apatch' }}
        working-directory: kernel
        run: |
         echo "Configuring KALLSYMS..."

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS_ALL
 
         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== KALLSYMS CONFIG ==="
         grep -E '^CONFIG_KALLSYMS(=|_)' "$BUILD_DIR/.config" || true

      - name: Configure KernelSU
        if: ${{ inputs.ROOT_MANAGER == 'kernelsu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      # APatch
      - name: Configure APatch
        if: ${{ inputs.ROOT_MANAGER == 'apatch' }}
        working-directory: kernel
        run: |
         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS_ALL

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

      
      # ============================================================
      # FINAL ROOT MANAGER + SUSFS CHECK
      # ============================================================
      - name: Verify KernelSU and SUSFS
        shell: bash
        working-directory: kernel
        run: |
         set -e

         echo "================================"
         echo "FINAL KSU / SUSFS CONFIG"
         echo "================================"
     
         echo "Checking CONFIG_KSU..."
         grep -q '^CONFIG_KSU=y' .config
         echo "✓ CONFIG_KSU=y"

         echo "Checking CONFIG_OVERLAY_FS..."
         grep -q '^CONFIG_OVERLAY_FS=y' .config
         echo "✓ CONFIG_OVERLAY_FS=y"

         echo "Checking KernelSU source..."
         test -e drivers/kernelSU/Kconfig
         echo "✓ drivers/kernelSU/Kconfig found"

         echo "Checking SUSFS source..."
         if [ -d "fs/susfs" ] || grep -Rqs "susfs" fs include drivers 2>/dev/null; then
         echo "✓ SUSFS source detected"
         else
         echo "⚠ SUSFS source not detected"
         fi
 
         echo
         echo "=== FINAL CONFIG ==="
         grep -nE '^CONFIG_(KSU|KSU_DEBUG|OVERLAY_FS)=' .config

         echo
         echo "KernelSU + SUSFS verification PASSED"
    
      - name: Check Clang 12.0.5
        run: |
         set -x

         echo "=== ENV ==="
         echo "PATH=$PATH"
         echo "CC=$CC"
         echo "LLVM=$LLVM"
         echo "CLANG_DIR=$CLANG_DIR"
 
         echo "=== CLANG ==="
         which clang
         clang --version

         echo "=== LLVM TOOLS ==="
         which ld.lld || true
         ld.lld --version || true

         echo "=== CLANG DIRECTORY ==="
         ls -lah "$CLANG_DIR/bin"
         

      - name: Find Whyred defconfig
        shell: bash
        run: |
         set -e
    
         echo "===== KERNEL SOURCE ====="
         echo "$KERNEL_DIR"

         test -d "$KERNEL_DIR/arch/arm64" || {
         echo "ERROR: arch/arm64 tidak ditemukan!"
         exit 1
         }

         echo "===== WHYRED DEFCONFIG ====="

         find "$KERNEL_DIR/arch/arm64/configs" \
         -maxdepth 1 \
         -type f \
         -name '*whyred*' \
         -print

         test -f "$KERNEL_DIR/arch/arm64/configs/whyred_defconfig" || {
         echo "ERROR: whyred_defconfig tidak ditemukan!"
         exit 1
         }

         echo "FOUND:"
         echo "$KERNEL_DIR/arch/arm64/configs/whyred_defconfig"

      # ============================================================
      # BUILD RAW KERNEL
      # ============================================================      
      - name: Build Kernel
        shell: bash
        working-directory: kernel
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            O="$BUILD_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          status=${PIPESTATUS[0]}

          echo "===== ERROR SEARCH ====="
          grep -nEi 'error:|fatal error:|undefined reference|Error [0-9]+|No rule to make|recipe for target' \
            "$GITHUB_WORKSPACE/build.log" | tail -30 || true

          exit "$status"

      # ============================================================
      # LZ4HC OPTIONAL
      # ============================================================
      - name: Compress kernel with LZ4HC
        if: ${{ inputs.LZ4HC == 'on' }}
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LZ4HC: ON"
          echo "======================================"

          IMAGE="$BUILD_DIR/arch/arm64/boot/Image"

          test -f "$IMAGE" || {
            echo "ERROR: Image tidak ditemukan!"
            exit 1
          }

          sudo apt-get update
          sudo apt-get install -y lz4

          lz4 -9 -f \
            "$IMAGE" \
            "$BUILD_DIR/arch/arm64/boot/Image.lz4"

          echo "=== LZ4HC RESULT ==="
          ls -lh \
            "$IMAGE" \
            "$BUILD_DIR/arch/arm64/boot/Image.lz4"


      - name: LZ4HC OFF
        if: ${{ inputs.LZ4HC == 'off' }}
        run: |
          echo "======================================"
          echo "LZ4HC: OFF"
          echo "======================================"
          echo "Using normal Image"
          
      # ============================================================
      # CHECK OUTPUT
      # ============================================================
      - name: Check kernel image
        run: |
          set -e

          echo "======================================"
          echo "KERNEL OUTPUT"
          echo "======================================"

          ls -lh "$BUILD_DIR/arch/arm64/boot/"

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Image.gz-dtb FOUND"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "Image.gz FOUND"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image" ]; then
            echo "Image FOUND"

          else
            echo "ERROR: Kernel image not found"
            exit 1
          fi

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare kernel image
        run: |
          set -e

          mkdir -p kernel-output

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" \
              kernel-output/Image.gz-dtb

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz" \
              kernel-output/Image.gz

          else
            cp "$BUILD_DIR/arch/arm64/boot/Image" \
              kernel-output/Image
          fi

          cp "$BUILD_DIR/.config" \
            kernel-output/kernel.config

          ls -lh kernel-output

      # ============================================================
      # ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          git clone \
            --depth=1 \
            -b whyred \
            https://github.com/d1aznr/AnyKernel3.git \
            "$ANYKERNEL_DIR"             
          
      # ============================================================
      # PREPARE ANYKERNEL3 KERNEL IMAGE
      # ============================================================
      - name: Prepare AnyKernel3 kernel
        run: |
          set -e

          echo "======================================"
          echo "PREPARE ANYKERNEL3"
          echo "======================================"

          if [ "${{ inputs.LZ4HC }}" = "on" ]; then

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image.lz4"

            test -f "$IMAGE" || {
              echo "ERROR: Image.lz4 tidak ditemukan!"
              exit 1
            }

            cp "$IMAGE" "$ANYKERNEL_DIR/Image.lz4"

            echo "Using: Image.lz4"

          else

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image"

            test -f "$IMAGE" || {
              echo "ERROR: Image tidak ditemukan!"
              exit 1
            }

            cp "$IMAGE" "$ANYKERNEL_DIR/Image"

            echo "Using: Image"

          fi

          echo "=== AnyKernel3 kernel ==="
          ls -lh \
            "$ANYKERNEL_DIR/Image" \
            "$ANYKERNEL_DIR/Image.lz4" 2>/dev/null || true
  
      # ============================================================
      # PACKAGE ANYKERNEL3
      # ============================================================
      - name: Package flashable ZIP
        run: |
          set -e

          echo "======================================"
          echo "PACKAGING SPECTRA ANYKERNEL3"
          echo "======================================"

          cd "$ANYKERNEL_DIR"

          # Bersihkan kernel image lama
          rm -f Image Image.lz4 Image.gz Image.gz-dtb

          # ========================================================
          # COPY KERNEL SESUAI PILIHAN LZ4HC
          # ========================================================

          if [ "${{ inputs.LZ4HC }}" = "on" ]; then

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image.lz4"

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Image.lz4 tidak ditemukan!"
              exit 1
            fi

            cp "$IMAGE" "$ANYKERNEL_DIR/Image.lz4"

            echo "Kernel image : Image.lz4"
            echo "LZ4HC        : ON"

          else

            IMAGE="$BUILD_DIR/arch/arm64/boot/Image"

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Image tidak ditemukan!"
              exit 1
            fi

            cp "$IMAGE" "$ANYKERNEL_DIR/Image"

            echo "Kernel image : Image"
            echo "LZ4HC        : OFF"

          fi

          # ========================================================
          # VERIFY ANYKERNEL3
          # ========================================================

          test -f anykernel.sh

          echo ""
          echo "ANYKERNEL3 CONTENT:"
          ls -lh Image* 2>/dev/null || true
          ls -lh anykernel.sh

          # ========================================================
          # KERNEL NAME
          # ========================================================

          ZIP_NAME="${KERNEL_NAME:-SPECTRA-Kernel}"

          # Hilangkan karakter aneh untuk nama ZIP
          ZIP_NAME=$(echo "$ZIP_NAME" | sed 's/^-//')

          FINAL_ZIP="${ZIP_NAME}-${GITHUB_RUN_NUMBER}.zip"

          # ========================================================
          # CREATE ZIP
          # ========================================================

          echo ""
          echo "Creating:"
          echo "$FINAL_ZIP"

          zip -r9 \
            "$GITHUB_WORKSPACE/$FINAL_ZIP" \
            . \
            -x ".git/*" \
            -x "*.github/*" \
            -x "README.md"

          # ========================================================
          # VERIFY ZIP
          # ========================================================

          if [ ! -f "$GITHUB_WORKSPACE/$FINAL_ZIP" ]; then
            echo "ERROR: ZIP gagal dibuat!"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "SPECTRA ANYKERNEL3 ZIP CREATED"
          echo "======================================"
          echo "ZIP : $FINAL_ZIP"
          echo "SIZE:"
          ls -lh "$GITHUB_WORKSPACE/$FINAL_ZIP"

          echo ""
          echo "ZIP CONTENT:"
          unzip -l "$GITHUB_WORKSPACE/$FINAL_ZIP" | head -40

          echo ""
          echo "======================================"
          echo "PACKAGE SUCCESS"
          echo "======================================"
      

      # ============================================================
      # CCACHE
      # ============================================================
      - name: ccache statistics
        run: |
          ccache -s || true

      - name: Prepare kernel image
        run: |
         set -e

         mkdir -p kernel-output

         if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
         cp "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" \
         kernel-output/Image.gz-dtb

         elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
         cp "$BUILD_DIR/arch/arm64/boot/Image.gz" \
         kernel-output/Image.gz

         elif [ -f "$BUILD_DIR/arch/arm64/boot/Image" ]; then
         cp "$BUILD_DIR/arch/arm64/boot/Image" \
         kernel-output/Image

         else
         echo "ERROR: Kernel image tidak ditemukan!"
         exit 1
         fi

         cp "$BUILD_DIR/.config" \
         kernel-output/kernel.config

         echo "=== KERNEL OUTPUT ==="
         ls -lh kernel-output

      # ============================================================
      # UPLOAD IMAGE
      # ============================================================
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel-output/Image

      # ============================================================
      # UPLOAD ANYKERNEL3 ZIP
      # ============================================================
      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRA-Kernel
          path: "*.zip"
          if-no-files-found: error
