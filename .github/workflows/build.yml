name: Build Whyred Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel branch
        required: true
        default: kernel-hmp
        type: string

      clean_build:
        description: Clean build
        required: true
        default: true
        type: boolean

      OC:
        description: "CPU Overclock"
        required: true
        default: "off"
        type: choice
        options:
          - off
          - 2.45GHz
      ZRAM:
        description: "Enable Automatic ZRAM"
        required: true
        default: true
        type: boolean

      ROOT_MANAGER:
        description: "Pilih Root Manager"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - kernelsu
          - sukisu
          - apatch
          - resukisu
          - mambosu
          - Ksun

jobs:
  build:
    name: Whyred Kernel
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/radcolor/android_kernel_xiaomi_whyred.git
      KERNEL_BRANCH: ${{ inputs.branch }}

      ARCH: arm64
      SUBARCH: arm64

      DEFCONFIG: whyred_defconfig
      
      BUILD_DIR: ${{ github.workspace }}/out
      KERNEL_DIR: ${{ github.workspace }}/kernel
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3

      # Fix GCC outline atomics
      KCFLAGS: -mno-outline-atomics

    steps:

      # ============================================================
      # CHECKOUT KERNEL
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: radcolor/android_kernel_xiaomi_whyred
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          path: kernel

      # ============================================================
      # DEPENDENCIES + BOTH TOOLCHAINS
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            zip \
            unzip \
            wget \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Setup toolchains
        run: |
          echo "======================================"
          echo "AARCH64 TOOLCHAIN"
          echo "======================================"

          aarch64-linux-gnu-gcc --version

          echo ""
          echo "======================================"
          echo "ARM32 TOOLCHAIN"
          echo "======================================"

          arm-linux-gnueabi-gcc --version

          echo ""
          echo "======================================"
          echo "SETTING CROSS COMPILE"
          echo "======================================"

          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      - name: Install KernelSU
        if: ${{ inputs.ROOT_MANAGER == 'kernelsu' }}
        working-directory: kernel
        run: |
         echo "Installing KernelSU..."
         curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -
  
      - name: Install SukiSU-Ultra
        if: ${{ inputs.ROOT_MANAGER == 'sukisu' }}
        working-directory: kernel
        run: |
         echo "Installing SukiSU-Ultra..."
         curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -

      - name: Install ReSukiSU
        if: ${{ inputs.ROOT_MANAGER == 'resukisu' }}
        working-directory: kernel
        run: |
         echo "Installing ReSukiSU..."
         curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -

      - name: Install MamboSU
        if: ${{ inputs.ROOT_MANAGER == 'mambosu' }}
        working-directory: kernel
        run: |
         echo "Installing MamboSU..."
         curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -master

      - name: Install KernelSU Next
        if: ${{ inputs.ROOT_MANAGER == 'ksun' }}
        working-directory: kernel
        run: |
         echo "=== Installing KernelSU Next ==="

         curl -LSs \
         "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
      
      # ============================================================
      # CCACHE
      # ============================================================
      - name: Setup ccache
        run: |
          mkdir -p "$HOME/.ccache"

          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: whyred-kernel-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            whyred-kernel-${{ runner.os }}-

      # ============================================================
      # CLEAN BUILD
      # ============================================================
      - name: Clean build
        if: ${{ inputs.clean_build }}
        run: |
          rm -rf "$BUILD_DIR"

      # ============================================================
      # CHECK SOURCE
      # ============================================================
      - name: Check kernel source
        working-directory: kernel
        run: |
          echo "======================================"
          echo "KERNEL SOURCE"
          echo "======================================"

          git log -1 --oneline

          echo ""
          echo "Kernel version:"
          make kernelversion

          echo ""
          echo "Defconfig:"
          test -f "arch/arm64/configs/${DEFCONFIG}"

          echo "FOUND: arch/arm64/configs/${DEFCONFIG}"

      # ============================================================
      # CONFIGURE
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          mkdir -p "$BUILD_DIR"

          make O="$BUILD_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$DEFCONFIG"

          echo ""
          echo "======================================"
          echo "CONFIGURATION"
          echo "======================================"

          grep -E \
            'CONFIG_ARCH_QCOM|CONFIG_ARCH_SDM660|CONFIG_PREEMPT|CONFIG_CC_STACKPROTECTOR' \
            "$BUILD_DIR/.config" || true

      - name: Enable ZRAM
        if: ${{ inputs.ZRAM }}
        working-directory: kernel
        run: |
         set -e

         test -f "$BUILD_DIR/.config" || {
         echo "ERROR: $BUILD_DIR/.config tidak ditemukan"
         exit 1
         }

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_ZRAM

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_ZSMALLOC

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== ZRAM CONFIG ==="
         grep -E '^CONFIG_ZRAM=|^CONFIG_ZSMALLOC=' \
         "$BUILD_DIR/.config" || true

      - name: Configure KALLSYMS for APatch
        if: ${{ inputs.ROOT_MANAGER == 'apatch' }}
        working-directory: kernel
        run: |
         echo "Configuring KALLSYMS..."

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS_ALL
 
         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== KALLSYMS CONFIG ==="
         grep -E '^CONFIG_KALLSYMS(=|_)' "$BUILD_DIR/.config" || true

      - name: Configure KernelSU
        if: ${{ inputs.ROOT_MANAGER == 'kernelsu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure SukiSU-Ultra
        if: ${{ inputs.ROOT_MANAGER == 'sukisu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure ReSukiSU
        if: ${{ inputs.ROOT_MANAGER == 'resukisu' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      - name: Configure MamboSU
        if: ${{ inputs.ROOT_MANAGER == 'mambosu' }}
        working-directory: kernel
        run: |
         echo "=== Configuring MamboSU ==="

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KSU

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

         echo "=== MamboSU configuration ==="
         grep -E '^CONFIG_KSU(=|_)' "$BUILD_DIR/.config" || true

      - name: Configure KernelSU Next
        if: ${{ inputs.ROOT_MANAGER == 'Ksun' }}
        working-directory: kernel
        run: |
          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU

          scripts/config --file "$BUILD_DIR/.config" \
            --enable CONFIG_KSU_TAMPER_SYSCALL_TABLE

      # APatch
      - name: Configure APatch
        if: ${{ inputs.ROOT_MANAGER == 'apatch' }}
        working-directory: kernel
        run: |
         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS

         scripts/config --file "$BUILD_DIR/.config" \
         --enable CONFIG_KALLSYMS_ALL

         make O="$BUILD_DIR" \
         ARCH="$ARCH" \
         CROSS_COMPILE="$CROSS_COMPILE" \
         CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
         olddefconfig

      # ============================================================
      # CPU OVERCLOCK - BIG CLUSTER 2.45GHz
      # ============================================================
      - name: Configure CPU OC
        if: ${{ inputs.OC == '2.45GHz' }}
        working-directory: kernel
        run: |
          set -e

          echo "======================================"
          echo "WHYRED BIG CLUSTER OC"
          echo "======================================"

          DTS_DIR="arch/arm/boot/dts/qcom"

          echo "Searching perfcl speed-bin tables..."

          grep -Rni \
            "qcom,perfcl-speedbin" \
            "$DTS_DIR" \
            2>/dev/null || true

          echo ""
          echo "Searching existing 2.4576GHz entries..."

          grep -Rni \
            "2457600000" \
            "$DTS_DIR" \
            2>/dev/null || true

          echo ""
          echo "Searching Big-cluster frequencies..."

          grep -RniE \
            "1958400000|2150400000|2208000000" \
            "$DTS_DIR" \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo "IMPORTANT"
          echo "======================================"
          echo "No blind global replacement will be performed."
          echo "The correct perfcl speed-bin table must be identified"
          echo "before modifying the OPP/LUT."

      # ============================================================
      # BUILD RAW KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "======================================"
          echo "BUILDING WHYRED KERNEL"
          echo "======================================"

          make -j"$(nproc)" \
            O="$BUILD_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image

          test -f "$BUILD_DIR/arch/arm64/boot/Image"

          echo "=== RAW IMAGE ==="
          ls -lh "$BUILD_DIR/arch/arm64/boot/Image"

      # ============================================================
      # COMPRESS KERNEL WITH LZ4HC
      # ============================================================
      - name: Compress kernel with LZ4HC
        working-directory: kernel
        shell: bash
        run: |
          set -e

          echo "=== CHECK KERNEL IMAGE ==="

          INPUT="arch/arm64/boot/Image"
          OUTPUT="arch/arm64/boot/Image.lz4"

          if [ ! -f "$INPUT" ]; then
            echo "ERROR: Image tidak ditemukan!"
            find arch/arm64/boot -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi

          echo "Input : $INPUT"
          echo "Output: $OUTPUT"

          echo ""
          echo "=== LZ4 VERSION ==="
          lz4 --version

          echo ""
          echo "=== COMPRESS LZ4HC ==="

          rm -f "$OUTPUT"

          lz4 -12 -f "$INPUT" "$OUTPUT"

          if [ ! -s "$OUTPUT" ]; then
            echo "ERROR: Image.lz4 gagal dibuat!"
            exit 1
          fi

          echo ""
          echo "=== SUCCESS ==="
          ls -lh "$INPUT"
          ls -lh "$OUTPUT"

      # ============================================================
      # CHECK OUTPUT
      # ============================================================
      - name: Check kernel image
        run: |
          set -e

          echo "======================================"
          echo "KERNEL OUTPUT"
          echo "======================================"

          ls -lh "$BUILD_DIR/arch/arm64/boot/"

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Image.gz-dtb FOUND"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            echo "Image.gz FOUND"

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image" ]; then
            echo "Image FOUND"

          else
            echo "ERROR: Kernel image not found"
            exit 1
          fi

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare kernel image
        run: |
          set -e

          mkdir -p kernel-output

          if [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz-dtb" \
              kernel-output/Image.gz-dtb

          elif [ -f "$BUILD_DIR/arch/arm64/boot/Image.gz" ]; then
            cp "$BUILD_DIR/arch/arm64/boot/Image.gz" \
              kernel-output/Image.gz

          else
            cp "$BUILD_DIR/arch/arm64/boot/Image" \
              kernel-output/Image
          fi

          cp "$BUILD_DIR/.config" \
            kernel-output/kernel.config

          ls -lh kernel-output

      # ============================================================
      # ANYKERNEL3
      # ============================================================
      - name: Clone AnyKernel3
        run: |
          git clone \
            --depth=1 \
            -b whyred \
            https://github.com/d1aznr/AnyKernel3.git \
            "$ANYKERNEL_DIR"

      # ============================================================
      # PUT LZ4 KERNEL INTO ANYKERNEL3
      # ============================================================
      - name: Prepare AnyKernel3 LZ4 image
        run: |
          set -e

          cd "$ANYKERNEL_DIR"

          rm -f Image
          rm -f Image.gz
          rm -f Image.gz-dtb
          rm -f Image.lz4
          rm -f Image.lz4-dtb

          cp "$GITHUB_WORKSPACE/kernel-output/Image.lz4" \
            "$ANYKERNEL_DIR/Image.lz4"

          test -f "$ANYKERNEL_DIR/Image.lz4"

          echo "=== ANYKERNEL3 KERNEL ==="
          ls -lh "$ANYKERNEL_DIR/Image.lz4"

      # ============================================================
      # AUTOMATIC ZRAM
      # ============================================================
      - name: Add Automatic ZRAM
        if: ${{ inputs.ZRAM }}
        run: |
          set -e

          ZRAM_SCRIPT="$ANYKERNEL_DIR/ramdisk/sbin/zram-auto.sh"

          mkdir -p "$ANYKERNEL_DIR/ramdisk/sbin"

          cat > "$ZRAM_SCRIPT" <<'EOF'
          #!/system/bin/sh

          ZRAM="/sys/block/zram0"

          # Wait for zram device
          i=0
          while [ "$i" -lt 10 ]; do
          [ -d "$ZRAM" ] && break
          sleep 1
          i=$((i + 1))
          done

          # Exit if zram does not exist
          [ -d "$ZRAM" ] || exit 0

          # Detect RAM in MB
          RAM_MB=$(awk '/MemTotal/ {print int($2 / 1024)}' /proc/meminfo)

          # Select zram size
          case "$RAM_MB" in
              ''|*[!0-9]*)
              SIZE_MB=2048
              ;;
          0|1|2|3*)
          SIZE_MB=2048
              ;;
          4*)
          SIZE_MB=2048
              ;;
          5*)
          SIZE_MB=3072
              ;;
          6*)
          SIZE_MB=3072
              ;;
          7*|8*|9*)
          SIZE_MB=4096
              ;;
          *)
          SIZE_MB=6144
              ;;
          esac
 
          # Disable old swap
          swapoff "$ZRAM/dev" 2>/dev/null || true

          # Reset zram
          echo 1 > "$ZRAM/reset" 2>/dev/null || true

          # Select LZ4HC when available
          if [ -f "$ZRAM/comp_algorithm" ]; then
          if grep -qw "lz4hc" "$ZRAM/comp_algorithm"; then
          echo lz4hc > "$ZRAM/comp_algorithm"
          elif grep -qw "lz4" "$ZRAM/comp_algorithm"; then
          echo lz4 > "$ZRAM/comp_algorithm"
          fi
          fi

          # Set zram size
          echo "${SIZE_MB}M" > "$ZRAM/disksize" 2>/dev/null || exit 0
 
          # Create swap
          mkswap "$ZRAM/dev" >/dev/null 2>&1 || exit 0
 
          # Enable swap
          swapon "$ZRAM/dev" -p 32758 >/dev/null 2>&1 || exit 0

          exit 0
          EOF

          chmod 0755 "$ZRAM_SCRIPT"

          echo "======================================"
          echo "AUTOMATIC ZRAM"
          echo "======================================"

          ls -lh "$ZRAM_SCRIPT"

          echo "Checking syntax..."
          sh -n "$ZRAM_SCRIPT"

          echo "ZRAM SCRIPT: OK"

      # ============================================================
      # PACKAGE ANYKERNEL3
      # ============================================================
      - name: Package flashable ZIP
        run: |
          set -e

          cd "$ANYKERNEL_DIR"

          test -f Image.lz4

          zip -r9 \
            "$GITHUB_WORKSPACE/Whyred-Kernel-LZ4HC-${GITHUB_RUN_NUMBER}.zip" \
            . \
            -x ".git/*"

          echo "======================================"
          echo "ANYKERNEL3 ZIP CREATED"
          echo "======================================"

          ls -lh \
            "$GITHUB_WORKSPACE/Whyred-Kernel-LZ4HC-${GITHUB_RUN_NUMBER}.zip"
      

      # ============================================================
      # CCACHE
      # ============================================================
      - name: ccache statistics
        run: |
          ccache -s || true

      # ============================================================
      # UPLOAD IMAGE
      # ============================================================
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-Kernel-Image
          path: kernel-output/

      # ============================================================
      # UPLOAD ZIP
      # ============================================================
      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-Kernel-AnyKernel3
          path: Whyred-Kernel-*.zip
